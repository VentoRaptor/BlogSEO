<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact us | PiPol</title>
  <meta name="description" content="Contact the PiPol newsroom.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <a href="index.html" aria-label="PiPol home"><img src="assets/pipol-logo.png" alt="PiPol logo" class="logo-img"></a>
        <p class="tagline">Your trusted source for totally <span class="strike">not</span> satire news!</p>
      </div>
    </div>
  </header>

  <nav class="main-nav" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="latest.html" class="nav-item">Latest articles</a>
      <a href="about.html" class="nav-item">About us</a>
      <a href="contact.html" class="nav-item" aria-current="page">Contact us</a>
    </div>
  </nav>

  <main class="container page-content contact-page">
    <h1 class="page-title">Contact us</h1>
    <p class="lead">Have a tip, correction, or wonderfully absurd story idea? Send it our way.</p>
    <form class="contact-form" action="mailto:hello@pipol.example" method="post" enctype="text/plain">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="7" required></textarea>
      <button type="submit">Send message</button>
    </form>
  </main>

  <footer class="site-footer"><p>© 2006-<span id="year"></span> PiPol — All rights reserved.</p></footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
